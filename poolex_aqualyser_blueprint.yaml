blueprint:
  name: "Poolex Aqualyser - Filtration & Chlorination Management"
  description: >
    ## 🏊 Poolex Aqualyser - Smart Filtration & Chlorination / Gestion Smart Filtration & Chloration

    ### EN - English
    Simple and focused blueprint to adjust filtration time and chlorination (treatment) duration based on water temperature, following the manufacturer's exact recommendations.

    **Manufacturer Recommendation Table:**
    - **10°C ≤ T° < 20°C (or covered pool):** Treatment = 2h | Filtration = 6h
    - **20°C ≤ T° < 25°C:** Treatment = 4h | Filtration = 10h
    - **25°C ≤ T° < 28°C:** Treatment = 6h | Filtration = 14h
    - **T° ≥ 28°C:** Treatment = 8h | Filtration = 18h
    - **T° ≥ 28°C (High attendance):** Treatment = 12h | Filtration = 24h
    - **T° ≥ 30°C (High attendance):** Treatment = 24h (BOOST) | Filtration = 24h

    ---

    ### FR - Français
    Blueprint simple et ciblé pour ajuster le temps de filtration et la durée de chloration (traitement) selon la température de l'eau, en suivant les préconisations exactes du fabricant.

    **Tableau des préconisations fabricant :**
    - **10°C ≤ T° < 20°C (ou piscine couverte) :** Traitement = 2h | Filtration = 6h
    - **20°C ≤ T° < 25°C :** Traitement = 4h | Filtration = 10h
    - **25°C ≤ T° < 28°C :** Traitement = 6h | Filtration = 14h
    - **T° ≥ 28°C :** Traitement = 8h | Filtration = 18h
    - **T° ≥ 28°C (Forte fréquentation) :** Traitement = 12h | Filtration = 24h
    - **T° ≥ 30°C (Forte fréquentation) :** Traitement = 24h (BOOST) | Filtration = 24h

  domain: automation
  input:
    water_temperature_sensor:
      name: "Water Temperature Sensor / Capteur Température Eau"
      description: "Sensor providing current pool water temperature (dp 111)."
      selector:
        entity:
          domain: sensor
          device_class: temperature

    chlorination_time_number:
      name: "Chlorination Time Number / Temps de Chloration"
      description: "Number entity to set chlorination duration in hours (dp 104)."
      selector:
        entity:
          domain: number

    boost_switch:
      name: "Boost Switch / Interrupteur Boost"
      description: "Switch entity to activate 24h Boost mode (dp 106)."
      selector:
        entity:
          domain: switch

    filtration_pump_switch:
      name: "Filtration Pump Switch / Switch Pompe de Filtration"
      description: "Switch entity controlling the filtration pump (external switch or dry contact)."
      selector:
        entity:
          domain: switch

    high_attendance_mode:
      name: "High Attendance Mode / Mode Forte Fréquentation"
      description: "Enable if the pool has heavy usage/attendance."
      default: false
      selector:
        boolean: {}

    daily_start_time:
      name: "Daily Filtration Start Time / Heure de Début de Filtration"
      description: "Time of day when the filtration cycle starts."
      default: "09:00:00"
      selector:
        time: {}

variables:
  temp_sensor: !input water_temperature_sensor
  chlor_time_entity: !input chlorination_time_number
  boost_entity: !input boost_switch
  pump_entity: !input filtration_pump_switch
  high_use: !input high_attendance_mode

trigger:
  - platform: time
    at: !input daily_start_time
    id: daily_start

action:
  - choose:
      - conditions:
          - condition: template
            value_template: "{{ states(temp_sensor) | float(20) < 10 }}"
        sequence:
          # Under 10°C, system is inoperable per manual
          - action: number.set_value
            target:
              entity_id: !input chlorination_time_number
            data:
              value: 1

      - conditions:
          - condition: template
            value_template: "{{ 10 <= states(temp_sensor) | float(20) < 20 }}"
        sequence:
          - action: number.set_value
            target:
              entity_id: !input chlorination_time_number
            data:
              value: 2
          - action: switch.turn_on
            target:
              entity_id: !input filtration_pump_switch
          - delay:
              hours: 6
          - action: switch.turn_off
            target:
              entity_id: !input filtration_pump_switch

      - conditions:
          - condition: template
            value_template: "{{ 20 <= states(temp_sensor) | float(20) < 25 }}"
        sequence:
          - action: number.set_value
            target:
              entity_id: !input chlorination_time_number
            data:
              value: 4
          - action: switch.turn_on
            target:
              entity_id: !input filtration_pump_switch
          - delay:
              hours: 10
          - action: switch.turn_off
            target:
              entity_id: !input filtration_pump_switch

      - conditions:
          - condition: template
            value_template: "{{ 25 <= states(temp_sensor) | float(20) < 28 }}"
        sequence:
          - action: number.set_value
            target:
              entity_id: !input chlorination_time_number
            data:
              value: 6
          - action: switch.turn_on
            target:
              entity_id: !input filtration_pump_switch
          - delay:
              hours: 14
          - action: switch.turn_off
            target:
              entity_id: !input filtration_pump_switch

      - conditions:
          - condition: template
            value_template: "{{ 28 <= states(temp_sensor) | float(20) < 30 }}"
        sequence:
          - if:
              - condition: template
                value_template: "{{ high_use }}"
            then:
              - action: number.set_value
                target:
                  entity_id: !input chlorination_time_number
                data:
                  value: 12
              - action: switch.turn_on
                target:
                  entity_id: !input filtration_pump_switch
              - delay:
                  hours: 24
              - action: switch.turn_off
                target:
                  entity_id: !input filtration_pump_switch
            else:
              - action: number.set_value
                target:
                  entity_id: !input chlorination_time_number
                data:
                  value: 8
              - action: switch.turn_on
                target:
                  entity_id: !input filtration_pump_switch
              - delay:
                  hours: 18
              - action: switch.turn_off
                target:
                  entity_id: !input filtration_pump_switch

      - conditions:
          - condition: template
            value_template: "{{ states(temp_sensor) | float(20) >= 30 }}"
        sequence:
          - if:
              - condition: template
                value_template: "{{ high_use }}"
            then:
              - action: switch.turn_on
                target:
                  entity_id: !input boost_switch
              - action: switch.turn_on
                target:
                  entity_id: !input filtration_pump_switch
              - delay:
                  hours: 24
              - action: switch.turn_off
                target:
                  entity_id: !input filtration_pump_switch
            else:
              - action: number.set_value
                target:
                  entity_id: !input chlorination_time_number
                data:
                  value: 12
              - action: switch.turn_on
                target:
                  entity_id: !input filtration_pump_switch
              - delay:
                  hours: 24
              - action: switch.turn_off
                target:
                  entity_id: !input filtration_pump_switch

mode: single
max_exceeded: silent
